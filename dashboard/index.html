<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0608" />
    <meta name="description" content="SecureVault locker management and live monitoring dashboard by TEAM FIGHT CLUB" />
    <link rel="manifest" href="/manifest.json" />
    <title>SecureVault | TEAM FIGHT CLUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        background-color: #080407;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .splash-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(236,72,153,0.35) 0%, rgba(249,115,22,0.15) 70%, transparent 100%);
        filter: blur(20px);
        animation: pulse 2s infinite ease-in-out;
      }
      .splash-text-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #ffffff;
        margin: 0;
      }
      .splash-text-sub {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        margin-top: 8px;
        background: linear-gradient(135deg, #fb923c, #ec4899, #f43f5e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ec4899;
        border-radius: 50%;
        margin-top: 32px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
    </style>
  </head>
  <body class="bg-[#080407] text-white">
    <div id="app-splash">
      <div class="splash-logo-container">
        <div class="splash-glow"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="url(#splash-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="splash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fb923c" />
              <stop offset="50%" stop-color="#ec4899" />
              <stop offset="100%" stop-color="#f43f5e" />
            </linearGradient>
          </defs>
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h1 class="splash-text-title">SECUREVAULT</h1>
      <div class="splash-text-sub">TEAM FIGHT CLUB</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Keep the development dashboard fresh and let authentication requests
      // pass directly to the local server. Use the offline cache only when hosted.
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        if (isLocalDevelopment) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          }).catch(() => {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
      // Remove splash once React is mounted
      window.addEventListener('vault-mounted', () => {
        const splash = document.getElementById('app-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 500);
        }
      });
    </script>
  </body>
</html>
